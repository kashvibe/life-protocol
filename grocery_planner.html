<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grocery Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c0a09; color: #fafaf9; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .checkbox-custom { appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #57534e; border-radius: 4px; outline: none; cursor: pointer; position: relative; background-color: transparent; transition: all 0.2s; }
        .checkbox-custom:checked { background-color: #10b981; border-color: #10b981; }
        .checkbox-custom:checked::after { content: '✓'; position: absolute; color: white; font-size: 0.8rem; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .item-row.completed { opacity: 0.4; }
        .item-row.completed label { text-decoration: line-through; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="glass-card sticky top-0 z-50 backdrop-blur-xl border-b-0">
        <div class="max-w-md mx-auto px-6 py-4 flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-2xl" onclick="navigator.vibrate(15)">🏠</a>
                <h1 class="text-xl font-bold tracking-tight">Coles Budget Run</h1>
                <button onclick="clearRun()" class="text-xs bg-stone-800 px-3 py-1 rounded text-stone-300 active:scale-95 transition-transform">Clear</button>
            </div>
            <div class="w-full bg-stone-800 rounded-full h-2 overflow-hidden relative">
                <div id="progressBar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full transition-all duration-500 w-0"></div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 pt-6 space-y-6" id="listContainer">
        <!-- Injected via JS -->
    </main>

    <script>
        const groceryData = {
            "Meat & Dairy": [
                { id: 'm1', name: 'Coles RSPCA Chicken Breast', qty: '1.4kg' },
                { id: 'm2', name: 'Large Eggs', qty: '1 Dozen' }
            ],
            "Frozen & Volume": [
                { id: 'f1', name: 'Coles Simply Mixed Veg', qty: '3x 1kg' }
            ],
            "Bulk Carbs & Staples": [
                { id: 'p1', name: 'Coles Red Split Lentils', qty: '1kg' },
                { id: 'p2', name: 'Coles White Long Grain Rice', qty: '1kg' },
                { id: 'p3', name: 'Coles Simply Rolled Oats', qty: '1.8kg' },
                { id: 'p4', name: 'Peanut Butter (Smooth/Crunchy)', qty: '500g Jar' }
            ],
            "Cosmetics & Care": [
                { id: 'c1', name: 'Avène Spring Spray', qty: 'Restock' },
                { id: 'c2', name: 'Oral-B Pro 100 Heads', qty: 'Restock' },
                { id: 'c3', name: 'Vitamin C & Niacinamide', qty: 'Restock' },
                { id: 'c4', name: 'Face Sunscreen & Wash', qty: 'Restock' },
                { id: 'c5', name: 'Dry Shampoo & Styler', qty: 'Restock' }
            ]
        };

        let checkedState = JSON.parse(localStorage.getItem('groceryStateBudget')) || [];
        let totalItems = 0;

        function initApp() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            totalItems = 0;

            for (const [category, items] of Object.entries(groceryData)) {
                let html = `<div class="glass-card rounded-2xl p-5 mb-4"><h2 class="font-bold text-emerald-400 mb-3">${category}</h2><div class="space-y-3">`;
                
                items.forEach(item => {
                    totalItems++;
                    const isChecked = checkedState.includes(item.id) ? 'checked' : '';
                    const completedClass = isChecked ? 'completed' : '';
                    
                    html += `
                        <div class="item-row flex items-center gap-4 ${completedClass}" id="row-${item.id}">
                            <input type="checkbox" id="${item.id}" class="checkbox-custom flex-shrink-0" ${isChecked} onchange="toggleItem('${item.id}', this.checked)">
                            <label for="${item.id}" class="flex-1 cursor-pointer text-sm font-medium flex justify-between">
                                ${item.name}
                                <span class="text-stone-500">${item.qty}</span>
                            </label>
                        </div>
                    `;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            }
            updateProgress();
        }

        function toggleItem(id, isChecked) {
            if (navigator.vibrate) navigator.vibrate(15);
            const row = document.getElementById(`row-${id}`);
            if (isChecked) {
                checkedState.push(id);
                row.classList.add('completed');
            } else {
                checkedState = checkedState.filter(i => i !== id);
                row.classList.remove('completed');
            }
            localStorage.setItem('groceryStateBudget', JSON.stringify(checkedState));
            updateProgress();
        }

        function updateProgress() {
            const percentage = Math.round((checkedState.length / totalItems) * 100);
            document.getElementById('progressBar').style.width = `${percentage}%`;
        }

        function clearRun() {
            if(confirm("Clear list for next week?")) {
                checkedState = [];
                localStorage.setItem('groceryStateBudget', JSON.stringify(checkedState));
                initApp();
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
