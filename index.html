<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Protocol Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #faf9f6; }
        .heading-font { font-family: 'Playfair Display', serif; }
        .app-card { transition: transform 0.2s, box-shadow 0.2s; }
        .app-card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md space-y-6">
        <div class="text-center mb-10">
            <h1 class="heading-font text-4xl text-emerald-900 font-semibold mb-2">Protocol Hub</h1>
            <p class="text-stone-500 text-sm">Select your dashboard</p>
        </div>

        <a href="daily_routine_dashboard.html" class="app-card block bg-white rounded-2xl p-6 border border-stone-200 shadow-sm flex items-center gap-4 group cursor-pointer">
            <div class="bg-blue-50 text-blue-600 p-4 rounded-xl text-2xl group-hover:scale-110 transition-transform">⏱️</div>
            <div>
                <h2 class="text-lg font-bold text-stone-800 mb-1">Daily Routine</h2>
                <p class="text-sm text-stone-500">Track your daily protocol & schedule</p>
            </div>
        </a>

        <a href="grocery_planner.html" class="app-card block bg-white rounded-2xl p-6 border border-stone-200 shadow-sm flex items-center gap-4 group cursor-pointer">
            <div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl text-2xl group-hover:scale-110 transition-transform">🛒</div>
            <div>
                <h2 class="text-lg font-bold text-stone-800 mb-1">Grocery Planner</h2>
                <p class="text-sm text-stone-500">Weekly Coles list & cabinet check</p>
            </div>
        </a>

        <a href="meal_prep_dashboard.html" class="app-card block bg-white rounded-2xl p-6 border border-stone-200 shadow-sm flex items-center gap-4 group cursor-pointer">
            <div class="bg-orange-50 text-orange-600 p-4 rounded-xl text-2xl group-hover:scale-110 transition-transform">🧑‍🍳</div>
            <div>
                <h2 class="text-lg font-bold text-stone-800 mb-1">Meal Prep</h2>
                <p class="text-sm text-stone-500">Weekend marination & packing guide</p>
            </div>
        </a>
    </main>

</body>
</html>
