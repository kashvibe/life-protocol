<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meal Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c0a09; color: #fafaf9; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .bento { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; height: 180px; }
        .bento-box { border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 8px; }
        .checkbox-custom { appearance: none; width: 1.25rem; height: 1.25rem; border: 2px solid #57534e; border-radius: 4px; outline: none; cursor: pointer; position: relative; }
        .checkbox-custom:checked { background-color: #10b981; border-color: #10b981; }
        .checkbox-custom:checked::after { content: '✓'; position: absolute; color: white; font-size: 0.8rem; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="glass-card sticky top-0 z-50 backdrop-blur-xl border-b-0">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl" onclick="navigator.vibrate(15)">🏠</a>
            <h1 class="text-xl font-bold tracking-tight">Meal Prep</h1>
            <button onclick="resetPrep()" class="text-xs text-stone-400 active:scale-95 transition-transform">Reset</button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 pt-6 space-y-8">
        
        <!-- Saturday Marination -->
        <section>
            <h2 class="text-lg font-bold text-emerald-400 mb-4">1. Sat Night Marination</h2>
            <div class="glass-card rounded-2xl p-5 space-y-4" id="prepList">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Sunday Bento Boxes -->
        <section>
            <h2 class="text-lg font-bold text-blue-400 mb-4">2. Sun Assembly (x5)</h2>
            
            <div class="glass-card rounded-2xl p-4 mb-4">
                <div class="flex justify-between mb-3"><h3 class="font-bold">💼 Lunch Box</h3><span class="text-xs bg-stone-800 px-2 py-1 rounded">1L</span></div>
                <div class="bento">
                    <div class="bento-box bg-emerald-500/20 text-emerald-300" style="grid-column: 1 / 2; grid-row: 1 / 3;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Fiber</span>
                        <span class="font-bold text-lg">150g</span><span class="text-xs">Broccoli</span><span class="my-1">+</span>
                        <span class="font-bold text-lg">150g</span><span class="text-xs">Beans</span>
                    </div>
                    <div class="bento-box bg-orange-500/20 text-orange-300" style="grid-column: 2 / 3; grid-row: 1 / 2;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Protein</span>
                        <span class="font-bold text-lg">180g</span><span class="text-xs">Tandoori</span>
                    </div>
                    <div class="bento-box bg-yellow-500/20 text-yellow-300" style="grid-column: 2 / 3; grid-row: 2 / 3;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Carbs</span>
                        <span class="font-bold text-lg">180g</span><span class="text-xs">Rice</span>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-4">
                <div class="flex justify-between mb-3"><h3 class="font-bold">🏠 Dinner Box</h3><span class="text-xs bg-stone-800 px-2 py-1 rounded">1L</span></div>
                <div class="bento">
                    <div class="bento-box bg-emerald-500/20 text-emerald-300" style="grid-column: 1 / 2; grid-row: 1 / 3;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Fiber</span>
                        <span class="font-bold text-lg">150g</span><span class="text-xs">Capsicum</span><span class="my-1">+</span>
                        <span class="font-bold text-lg">150g</span><span class="text-xs">Zucchini</span>
                    </div>
                    <div class="bento-box bg-red-500/20 text-red-300" style="grid-column: 2 / 3; grid-row: 1 / 2;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Protein</span>
                        <span class="font-bold text-lg">100g</span><span class="text-xs">Paneer</span>
                    </div>
                    <div class="bento-box bg-yellow-500/20 text-yellow-300" style="grid-column: 2 / 3; grid-row: 2 / 3;">
                        <span class="text-[10px] uppercase font-bold opacity-60">Carbs</span>
                        <span class="font-bold text-lg">200g</span><span class="text-xs">Sweet Potato</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const prepSteps = [
            { id: 'p1', label: 'Dice 900g chicken' },
            { id: 'p2', label: 'Mix 200g yoghurt, tandoori masala, ginger/garlic' },
            { id: 'p3', label: 'Coat chicken & refrigerate' },
            { id: 'p4', label: 'Cube 500g paneer' },
            { id: 'p5', label: 'Mix 100g yoghurt, tikka spice' },
            { id: 'p6', label: 'Coat paneer gently & refrigerate' }
        ];

        let prepState = JSON.parse(localStorage.getItem('prepState')) || [];

        function initApp() {
            const container = document.getElementById('prepList');
            container.innerHTML = '';
            
            prepSteps.forEach(step => {
                const isChecked = prepState.includes(step.id) ? 'checked' : '';
                container.innerHTML += `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" id="${step.id}" class="checkbox-custom flex-shrink-0" ${isChecked} onchange="togglePrep('${step.id}', this.checked)">
                        <label for="${step.id}" class="text-sm font-medium ${isChecked ? 'line-through opacity-50' : ''}">${step.label}</label>
                    </div>
                `;
            });
        }

        function togglePrep(id, isChecked) {
            if (navigator.vibrate) navigator.vibrate(15);
            if (isChecked) prepState.push(id);
            else prepState = prepState.filter(i => i !== id);
            localStorage.setItem('prepState', JSON.stringify(prepState));
            initApp();
        }

        function resetPrep() {
            prepState = [];
            localStorage.setItem('prepState', JSON.stringify(prepState));
            initApp();
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
