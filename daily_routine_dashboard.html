<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c0a09; color: #fafaf9; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        .timeline-checkbox { appearance: none; width: 1.5rem; height: 1.5rem; border: 2px solid #57534e; border-radius: 50%; outline: none; cursor: pointer; position: relative; background-color: transparent; transition: all 0.3s; z-index: 10; }
        .timeline-checkbox:checked { background-color: #10b981; border-color: #10b981; }
        .timeline-checkbox:checked::after { content: '✓'; position: absolute; color: white; font-size: 1rem; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .completed .item-content { opacity: 0.5; filter: grayscale(100%); }
        .completed h3 { text-decoration: line-through; }
        .timeline-line { position: absolute; left: 1.15rem; top: 2rem; bottom: -1rem; width: 2px; background-color: #292524; z-index: 1; }
        .progress-circle { transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1); transform: rotate(-90deg); transform-origin: 50% 50%; }
        /* Mobile-friendly bottom nav */
        .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="glass-card sticky top-0 z-50 backdrop-blur-xl border-b-0">
        <div class="max-w-md mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl" onclick="triggerHaptic()">🏠</a>
            <div class="text-center">
                <h1 class="text-xl font-bold tracking-tight">Daily Protocol</h1>
                <p class="text-stone-400 text-xs" id="currentDate">Loading...</p>
            </div>
            <div class="relative w-12 h-12 flex items-center justify-center">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <circle class="text-stone-800 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                    <circle id="progressCircle" class="text-emerald-500 progress-circle stroke-current" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2"></circle>
                </svg>
                <div class="absolute flex flex-col items-center justify-center">
                    <span id="progressText" class="text-[10px] font-bold">0%</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-6 pt-6" id="timelineContainer">
        <!-- Injected via JS -->
    </main>

    <script>
        const routineData = [
            { id: 't1', time: '5:30 AM', title: 'Wake Up & Hydrate', note: 'Drink 500ml water.', icon: '⏰' },
            { id: 't2', time: '6:30 AM', title: '5x5 Workout', note: 'Heavy compound lifts.', icon: '🏋️' },
            { id: 't3', time: '8:00 AM', title: 'Shower & Pack', note: 'Grab lunch box.', icon: '🚿' },
            { id: 't4', time: '9:00 AM', title: 'Supplements', note: 'Multivitamin, Probiotic, Omega Triple.', icon: '💊' },
            { id: 't5', time: '9:15 AM', title: 'Breakfast', note: 'Eat at desk.', icon: '🍳' },
            { id: 't6', time: '1:00 PM', title: 'Lunch', note: 'Reheat prepped meal.', icon: '🍱' },
            { id: 't7', time: '3:30 PM', title: 'Protein Oats', note: 'Mix in collagen.', icon: '🥣' },
            { id: 't8', time: '6:00 PM', title: 'Dinner', note: 'Reheat dinner box.', icon: '🍽️' },
            { id: 't9', time: '8:15 PM', title: 'Magnesium', note: 'Mix in warm water.', icon: '🌙' },
            { id: 't10', time: '9:00 PM', title: 'Sleep Target', note: 'Zero screens. Lights out.', icon: '💤' }
        ];

        let state = JSON.parse(localStorage.getItem('dailyState')) || { date: new Date().toDateString(), completed: [] };

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function initApp() {
            // Auto-reset at midnight
            if (state.date !== new Date().toDateString()) {
                state = { date: new Date().toDateString(), completed: [] };
                saveState();
            }

            document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-AU', { weekday: 'long', month: 'short', day: 'numeric' });
            
            const container = document.getElementById('timelineContainer');
            routineData.forEach((item, index) => {
                const isLast = index === routineData.length - 1;
                const isChecked = state.completed.includes(item.id) ? 'checked' : '';
                const completedClass = isChecked ? 'completed' : '';
                
                container.innerHTML += `
                    <div class="timeline-item relative flex gap-4 pb-8" id="container-${item.id}">
                        <div class="relative flex flex-col items-center">
                            <input type="checkbox" id="${item.id}" class="timeline-checkbox flex-shrink-0 mt-1" ${isChecked} onchange="toggleItem('${item.id}', this.checked)">
                            ${!isLast ? '<div class="timeline-line"></div>' : ''}
                        </div>
                        <label for="${item.id}" class="flex-1 cursor-pointer group item-content transition-all duration-300">
                            <div class="glass-card rounded-2xl p-4 active:scale-95 transition-transform">
                                <div class="flex justify-between items-start mb-1">
                                    <h3 class="font-bold text-stone-100 text-lg"><span class="mr-2">${item.icon}</span>${item.title}</h3>
                                    <span class="text-emerald-400 text-xs font-bold bg-emerald-400/10 px-2 py-1 rounded">${item.time}</span>
                                </div>
                                <p class="text-sm text-stone-400">${item.note}</p>
                            </div>
                        </label>
                    </div>
                `;
            });
            updateProgress();
        }

        function toggleItem(id, isChecked) {
            triggerHaptic();
            const container = document.getElementById(`container-${id}`);
            if (isChecked) {
                state.completed.push(id);
                container.classList.add('completed');
            } else {
                state.completed = state.completed.filter(i => i !== id);
                container.classList.remove('completed');
            }
            saveState();
            updateProgress();
        }

        function saveState() {
            localStorage.setItem('dailyState', JSON.stringify(state));
        }

        function updateProgress() {
            const percentage = Math.round((state.completed.length / routineData.length) * 100);
            document.getElementById('progressText').innerText = `${percentage}%`;
            document.getElementById('progressCircle').style.strokeDashoffset = 251.2 - (percentage / 100) * 251.2;
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
